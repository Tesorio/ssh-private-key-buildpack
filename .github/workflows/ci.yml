name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint shell scripts
        run: shellcheck -S warning bin/* test/*.sh
      - name: Smoke test bin/compile
        run: test/compile_test.sh
